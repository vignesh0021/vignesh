# Local dev stack. `pnpm docker:up` brings up datastores; api/web run via `pnpm dev`
# (or uncomment the app services to run everything containerised).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tlh
      POSTGRES_PASSWORD: tlh
      POSTGRES_DB: tradelikehunter
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  # api:
  #   build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
  #   env_file: ../../.env
  #   depends_on: { postgres: { condition: service_healthy }, redis: {} }
  #   ports: ["4000:4000"]

  # web:
  #   build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
  #   depends_on: [api]
  #   ports: ["5173:80"]

volumes:
  pgdata: {}
  redisdata: {}
