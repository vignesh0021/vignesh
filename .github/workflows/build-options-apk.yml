name: Build Options Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/options-payoff-analyzer-app-9jsuls
      - claude/options-paper-trading-mode-sywt0f
    paths:
      - "options-analyzer/**"
      - ".github/workflows/build-options-apk.yml"

jobs:
  build:
    name: Prebuild + Gradle APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: options-analyzer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Expo prebuild (generate native android project)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Build release APK (signed with default debug keystore)
        working-directory: options-analyzer/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: options-analyzer-apk
          path: options-analyzer/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
