name: Build Loadshare APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/loadshare-area-alert-app-NPUJn

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: claude/loadshare-area-alert-app-NPUJn

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: LoadshareAreaAlert
        run: chmod +x gradlew

      - name: Download Gradle wrapper jar
        working-directory: LoadshareAreaAlert
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        working-directory: LoadshareAreaAlert
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoadshareAreaAlert-debug
          path: LoadshareAreaAlert/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
