name: selva-elevation CI

on:
  push:
    paths:
      - "selva-elevation/**"
      - ".github/workflows/selva-elevation-ci.yml"
  pull_request:
    paths:
      - "selva-elevation/**"
      - ".github/workflows/selva-elevation-ci.yml"

defaults:
  run:
    working-directory: selva-elevation

jobs:
  backend:
    name: Backend smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt httpx
      - name: Generate all views + render endpoint (provider=none)
        working-directory: selva-elevation/backend
        env:
          LLM_PROVIDER: none
          IMAGE_PROVIDER: none
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app
          c = TestClient(app.app)
          assert c.get("/api/health").json()["ok"] is True
          ex = c.get("/api/example").json()
          need = {"front","rear","left","right","top","elevation"}
          assert need <= set(ex["views"]), ex["views"].keys()
          assert [f["name"] for f in ex["spec"]["floors"]] == ["Ground","First","Second"]
          # render endpoint builds prompts even when no image provider is configured
          r = c.post("/api/render3d", json={"spec": ex["spec"], "theme_id": "mono"})
          assert "positive" in r.json()["prompts"]
          # Verify & Edit gate: an edited spec re-generates views; bad spec is rejected
          spec = ex["spec"]; spec["floors"][0]["height"] = 14
          v = c.post("/api/views", json={"spec": spec})
          assert v.status_code == 200 and v.json()["spec"]["floors"][0]["height"] == 14
          assert need <= set(v.json()["views"])
          bad = c.post("/api/views", json={"spec": {"floors": "nope"}})
          assert bad.status_code == 400
          # vector parser: non-vector input degrades gracefully (no crash, no false spec)
          import vector_parser
          s, notes = vector_parser.parse(b"not a pdf")
          assert s is None and notes
          # Tamil Nadu height standard applied by default + custom standard via /api/views
          std = c.get("/api/standards").json()
          assert std["default"] == "tn" and any(x["id"] == "tn" for x in std["standards"])
          assert ex["spec"]["plinth"] == 2.0 and ex["spec"]["lintel"] == 7.0
          cust = {"floor_height": 11, "stilt_height": 9, "plinth": 1.5, "parapet": 4,
                  "lintel": 7, "window_sill": 3, "vent_sill": 6, "door_height": 7}
          w = c.post("/api/views", json={"spec": ex["spec"], "apply_standard": cust}).json()
          assert [f["height"] for f in w["spec"]["floors"]][0] == 9 and w["spec"]["plinth"] == 1.5
          # parser places only exterior openings (no internal doors) on valid walls
          import spec_schema
          demo = spec_schema.SELVA_EXAMPLE
          for op in [o for fl in demo.floors for o in fl.openings]:
              assert op.wall in {"front", "rear", "left", "right"}
          print("backend OK — views, edit-gate, vector-parser, TN standards")
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: selva-elevation/frontend/package-lock.json
      - name: Install & build
        working-directory: selva-elevation/frontend
        run: |
          npm ci
          npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: selva-elevation/backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: selva-elevation/frontend
          push: false
