name: OpenCode Mobile CI/CD

on:
  push:
    paths:
      - "opencode-android/**"
      - ".github/workflows/opencode-android.yml"
  pull_request:
    paths:
      - "opencode-android/**"
      - ".github/workflows/opencode-android.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Build a signed release AAB/APK and attach as artifacts"
        type: boolean
        default: true

concurrency:
  group: opencode-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: opencode-android

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build + unit test on every push / PR. Produces a debug APK artifact.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-debug-apk
          path: opencode-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: opencode-android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: opencode-android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Signed release build. Runs on main-branch pushes and manual dispatch.
  # Falls back to debug signing automatically when signing secrets are absent,
  # so the pipeline never breaks on forks or before secrets are configured.
  # ---------------------------------------------------------------------------
  release:
    name: Signed release (AAB + APK)
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "1.0.${{ github.run_number }}"
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Signing keystore decoded."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; release will use debug signing."
          fi

      - name: Build signed release AAB + APK
        env:
          OPENCODE_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          OPENCODE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENCODE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENCODE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: opencode-release-aab
          path: opencode-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-release-apk
          path: opencode-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
