name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: LoadshareAreaAlert
        run: chmod +x gradlew

      - name: Download Gradle wrapper jar
        working-directory: LoadshareAreaAlert
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME/.gradle/wrapper/dists/gradle-8.7-bin/
          mkdir -p gradle/wrapper
          curl -L "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        working-directory: LoadshareAreaAlert
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoadshareAreaAlert-debug
          path: LoadshareAreaAlert/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
